unbind C-b
set -g prefix C-a
bind C-a send-prefix

set-option default-terminal "tmux-256color"

# Enable mouse support (for scrolling, pane selection, etc.)
set -g mouse on

# Define my custom menu bar
  # status bar colors
  set -g status-bg black
  set -g status-fg white

  # alignment settings
  set-option -g status-justify centre

  # status left options
  set-option -g status-left '#[fg=green][#[bg=black,fg=cyan]#S#[fg=green]]'
  set-option -g status-left-length 20

  # window list options
  setw -g automatic-rename on
  set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path}/,#{pane_current_command}}'
  set-window-option -g window-status-format '#[fg=cyan,dim]#I#[fg=blue]:#[default]#W#[fg=grey,dim]#F'
  set-window-option -g window-status-current-format '#[bg=blue,fg=black]#I#[bg=blue,fg=black]:#[fg=black]#W#[fg=dim]#F'
  set -g base-index 1

  # status right options
  set -g status-right '#[fg=green][#[fg=blue]%Y-%m-%d #[fg=white]%H:%M#[default] #($HOME/bin/power_state)#($HOME/bin/battery)#[fg=green]]'

# bind a reload key
bind R source-file ~/.tmux.conf \; display-message "  Config reloaded..".

# bind key to save scrollback history
bind S run-shell "~/bin/tmux-save-scrollback"

# Auto-save scrollback periodically for configured applications
# Start daemon in background when a tmux session is created
set-hook -g session-created 'run-shell -b "~/bin/tmux-save-scrollback-daemon"'

set-option -g status-interval 1
